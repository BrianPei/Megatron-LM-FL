name: Common All Tests

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
        description: Platform configuration name
      run_unit_tests:
        required: false
        type: boolean
        default: true
        description: Whether to run unit tests in this workflow
      run_functional_tests:
        required: false
        type: boolean
        default: true
        description: Whether to run functional tests in this workflow
      prepare_te_fl_only:
        required: false
        type: boolean
        default: false
        description: Resolve TE-FL main and prepare its native cache without running tests
      image_override:
        required: false
        type: string
        default: ''
        description: 'Optional immutable image override (must be image@sha256:digest format)'
      expected_te_fl_commit:
        required: false
        type: string
        default: ''
        description: 'Expected TE-FL commit SHA (40 hex chars) for verification'
      te_fl_ref:
        required: false
        type: string
        default: ''
        description: 'TransformerEngine-FL branch or immutable commit'

jobs:
  checkout_and_config:
    name: checkout_and_config
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    outputs:
      ci_image: ${{ steps.resolve_image.outputs.ci_image }}
      expected_te_fl_commit: ${{ steps.resolve_image.outputs.expected_te_fl_commit }}
      runs_on: ${{ steps.config.outputs.runs_on }}
      container_volumes: ${{ steps.config.outputs.container_volumes }}
      container_options: ${{ steps.config.outputs.container_options }}
      device_types: ${{ steps.config.outputs.device_types }}
      setup_script: ${{ steps.config.outputs.setup_script }}
      unit_nproc_per_node: ${{ steps.config.outputs.unit_nproc_per_node }}
      te_fl_prepare_nproc_per_node: ${{ steps.config.outputs.te_fl_prepare_nproc_per_node }}
      train_test_matrix: ${{ steps.config.outputs.train_test_matrix }}
      unit_test_groups: ${{ steps.config.outputs.unit_test_groups }}
      unit_pytest_extra_args: ${{ steps.config.outputs.unit_pytest_extra_args }}
      ignored_tests: ${{ steps.config.outputs.ignored_tests }}
      te_fl_ref: ${{ steps.config.outputs.te_fl_ref }}
      te_fl_mode: ${{ steps.config.outputs.te_fl_mode }}
      te_fl_target_arch: ${{ steps.config.outputs.te_fl_target_arch }}
      te_fl_compiler: ${{ steps.config.outputs.te_fl_compiler }}
      te_fl_require_shared_library: ${{ steps.config.outputs.te_fl_require_shared_library }}
      te_fl_source_paths: ${{ steps.config.outputs.te_fl_source_paths }}
      te_fl_build_files: ${{ steps.config.outputs.te_fl_build_files }}
      te_fl_build_env: ${{ steps.config.outputs.te_fl_build_env }}
      te_fl_build_pip_args: ${{ steps.config.outputs.te_fl_build_pip_args }}
      te_fl_install_pip_args: ${{ steps.config.outputs.te_fl_install_pip_args }}
      te_fl_native_modules: ${{ steps.config.outputs.te_fl_native_modules }}
      te_fl_runtime_modules: ${{ steps.config.outputs.te_fl_runtime_modules }}
      te_fl_bootstrap_modules: ${{ steps.config.outputs.te_fl_bootstrap_modules }}
      te_fl_device_module: ${{ steps.config.outputs.te_fl_device_module }}
      te_fl_native_module: ${{ steps.config.outputs.te_fl_native_module }}
      te_fl_expected_backend: ${{ steps.config.outputs.te_fl_expected_backend }}
      te_fl_runtime_env: ${{ steps.config.outputs.te_fl_runtime_env }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          set -euo pipefail

          PLATFORM="${{ inputs.platform }}"
          CONFIG_FILE=".github/configs/${PLATFORM}.yml"

          # Install mikefarah/yq (v4) for YAML parsing
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          /usr/local/bin/yq --version
          echo "Loading configuration from $CONFIG_FILE"

      - name: Validate and resolve image override
        id: resolve_image
        env:
          IMAGE_OVERRIDE: ${{ inputs.image_override }}
          EXPECTED_COMMIT: ${{ inputs.expected_te_fl_commit }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail

          CONFIG_FILE=".github/configs/${PLATFORM}.yml"

          # Validate expected_te_fl_commit format if provided
          if [[ -n "${EXPECTED_COMMIT}" ]]; then
            if ! [[ "${EXPECTED_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::expected_te_fl_commit must be 40 hex characters"
              echo "::error::Got: ${EXPECTED_COMMIT}"
              exit 1
            fi
          fi

          # Resolve CI image (override takes precedence)
          if [[ -n "${IMAGE_OVERRIDE}" ]]; then
            # Validate digest format: image@sha256:64-hex-chars
            if ! [[ "${IMAGE_OVERRIDE}" =~ ^[^@]+@sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::image_override must be in format: image@sha256:digest"
              echo "::error::Got: ${IMAGE_OVERRIDE}"
              exit 1
            fi

            CI_IMAGE="${IMAGE_OVERRIDE}"
            echo "Using image override: ${CI_IMAGE}"
          else
            # Fallback to platform config
            CI_IMAGE=$(yq '.ci_image' "$CONFIG_FILE")
            echo "Using platform config image: ${CI_IMAGE}"
          fi

          # Output resolved values
          echo "ci_image=${CI_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "expected_te_fl_commit=${EXPECTED_COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Read platform configuration
        id: config
        env:
          PLATFORM: ${{ inputs.platform }}
          TE_FL_REF_OVERRIDE: ${{ inputs.te_fl_ref }}
        run: |
          set -euo pipefail

          CONFIG_FILE=".github/configs/${PLATFORM}.yml"

          # Read runner labels and format as JSON array
          RUNS_ON=$(yq '.runner_labels | tojson(0)' "$CONFIG_FILE")
          echo "runs_on=$RUNS_ON" >> $GITHUB_OUTPUT

          # Read container volumes and format as JSON array
          VOLUMES=$(yq '.container_volumes | tojson(0)' "$CONFIG_FILE")
          echo "container_volumes=$VOLUMES" >> $GITHUB_OUTPUT

          # Read container options
          OPTIONS=$(yq '.container_options' "$CONFIG_FILE")
          echo "container_options=$OPTIONS" >> $GITHUB_OUTPUT

          # Read device types
          DEVICE_TYPES=$(yq '.device_types | tojson(0)' "$CONFIG_FILE")
          echo "device_types=$DEVICE_TYPES" >> $GITHUB_OUTPUT

          # Read the platform setup entry point shared by all test suites.
          SETUP_SCRIPT=$(yq '.setup_script' "$CONFIG_FILE")
          if [ -z "$SETUP_SCRIPT" ] || [ "$SETUP_SCRIPT" = "null" ]; then
            echo "::error::setup_script is required"
            exit 1
          fi
          echo "setup_script=$SETUP_SCRIPT" >> $GITHUB_OUTPUT

          # Read test matrix for training
          TRAIN_MATRIX=$(yq '.test_matrix.functional.train // [] | tojson(0)' "$CONFIG_FILE")
          if [ "${{ inputs.run_functional_tests }}" = "true" ] && [ "$TRAIN_MATRIX" = "[]" ]; then
            echo "::error::test_matrix.functional.train must contain at least one test when functional tests are enabled"
            exit 1
          fi
          echo "train_test_matrix=$TRAIN_MATRIX" >> $GITHUB_OUTPUT

          # Read the complete unit-test contract from the platform configuration.
          UNIT_NPROC_PER_NODE=$(yq '.test_matrix.unit.nproc_per_node // ""' "$CONFIG_FILE")
          PREPARE_NPROC_PER_NODE=$(yq '.test_matrix.unit.nproc_per_node // .test_matrix.functional.train[0].gpus_per_node // ""' "$CONFIG_FILE")
          UNIT_TEST_GROUPS=$(yq '.test_matrix.unit.groups // [] | tojson(0)' "$CONFIG_FILE")
          UNIT_PYTEST_EXTRA_ARGS=$(yq '.test_matrix.unit.pytest_extra_args // [] | tojson(0)' "$CONFIG_FILE")
          IGNORED_TESTS=$(yq '.test_matrix.unit.ignored_tests // [] | tojson(0)' "$CONFIG_FILE")

          if [ "${{ inputs.run_unit_tests }}" = "true" ] && [ "$UNIT_TEST_GROUPS" = "[]" ]; then
            echo "::error::test_matrix.unit.groups must contain at least one group when unit tests are enabled"
            exit 1
          fi
          if [ "${{ inputs.run_unit_tests }}" = "true" ] && ! [[ "$UNIT_NPROC_PER_NODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::test_matrix.unit.nproc_per_node must be a positive integer"
            exit 1
          fi
          if { [ "${{ inputs.run_unit_tests }}" = "true" ] || \
               [ "${{ inputs.run_functional_tests }}" = "true" ] || \
               [ "${{ inputs.prepare_te_fl_only }}" = "true" ]; } && \
             ! [[ "$PREPARE_NPROC_PER_NODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::TE-FL prepare requires a positive process count"
            exit 1
          fi
          echo "unit_nproc_per_node=$UNIT_NPROC_PER_NODE" >> $GITHUB_OUTPUT
          echo "te_fl_prepare_nproc_per_node=$PREPARE_NPROC_PER_NODE" >> $GITHUB_OUTPUT
          echo "unit_test_groups=$UNIT_TEST_GROUPS" >> $GITHUB_OUTPUT
          echo "unit_pytest_extra_args=$UNIT_PYTEST_EXTRA_ARGS" >> $GITHUB_OUTPUT
          echo "ignored_tests=$IGNORED_TESTS" >> $GITHUB_OUTPUT

          TE_FL_REF="$TE_FL_REF_OVERRIDE"
          if [ -z "$TE_FL_REF" ]; then
            TE_FL_REF=$(yq -r '.te_fl.ref // "main"' "$CONFIG_FILE")
          fi
          TE_FL_MODE=$(yq -r '.te_fl.native.mode // ""' "$CONFIG_FILE")
          TE_FL_TARGET_ARCH=$(yq -r '.te_fl.native.target_arch // ""' "$CONFIG_FILE")
          TE_FL_COMPILER=$(yq -r '.te_fl.native.compiler // ""' "$CONFIG_FILE")
          TE_FL_REQUIRE_SHARED_LIBRARY=$(yq -r '.te_fl.native.require_shared_library // false' "$CONFIG_FILE")
          TE_FL_SOURCE_PATHS=$(yq -o=json -I=0 '.te_fl.native.source_paths // []' "$CONFIG_FILE")
          TE_FL_BUILD_FILES=$(yq -o=json -I=0 '.te_fl.native.build_files // []' "$CONFIG_FILE")
          TE_FL_BUILD_ENV=$(yq -o=json -I=0 '.te_fl.native.environment // {}' "$CONFIG_FILE")
          TE_FL_BUILD_PIP_ARGS=$(yq -o=json -I=0 '.te_fl.native.build_pip_args // []' "$CONFIG_FILE")
          TE_FL_INSTALL_PIP_ARGS=$(yq -o=json -I=0 '.te_fl.runtime.install_pip_args // []' "$CONFIG_FILE")
          TE_FL_NATIVE_MODULES=$(yq -o=json -I=0 '[.te_fl.runtime.native_module] | map(select(. != null and . != ""))' "$CONFIG_FILE")
          TE_FL_RUNTIME_MODULES=$(yq -o=json -I=0 '.te_fl.native.runtime_modules // []' "$CONFIG_FILE")
          TE_FL_BOOTSTRAP_MODULES=$(yq -o=json -I=0 '.te_fl.runtime.bootstrap_modules // []' "$CONFIG_FILE")
          TE_FL_DEVICE_MODULE=$(yq -r '.te_fl.runtime.device_module // ""' "$CONFIG_FILE")
          TE_FL_NATIVE_MODULE=$(yq -r '.te_fl.runtime.native_module // ""' "$CONFIG_FILE")
          TE_FL_EXPECTED_BACKEND=$(yq -r '.te_fl.runtime.expected_backend // ""' "$CONFIG_FILE")
          TE_FL_RUNTIME_ENV=$(yq -o=json -I=0 '.te_fl.runtime.environment // {}' "$CONFIG_FILE")
          for pair in \
            "te_fl_ref=$TE_FL_REF" \
            "te_fl_mode=$TE_FL_MODE" \
            "te_fl_target_arch=$TE_FL_TARGET_ARCH" \
            "te_fl_compiler=$TE_FL_COMPILER" \
            "te_fl_require_shared_library=$TE_FL_REQUIRE_SHARED_LIBRARY" \
            "te_fl_source_paths=$TE_FL_SOURCE_PATHS" \
            "te_fl_build_files=$TE_FL_BUILD_FILES" \
            "te_fl_build_env=$TE_FL_BUILD_ENV" \
            "te_fl_build_pip_args=$TE_FL_BUILD_PIP_ARGS" \
            "te_fl_install_pip_args=$TE_FL_INSTALL_PIP_ARGS" \
            "te_fl_native_modules=$TE_FL_NATIVE_MODULES" \
            "te_fl_runtime_modules=$TE_FL_RUNTIME_MODULES" \
            "te_fl_bootstrap_modules=$TE_FL_BOOTSTRAP_MODULES" \
            "te_fl_device_module=$TE_FL_DEVICE_MODULE" \
            "te_fl_native_module=$TE_FL_NATIVE_MODULE" \
            "te_fl_expected_backend=$TE_FL_EXPECTED_BACKEND" \
            "te_fl_runtime_env=$TE_FL_RUNTIME_ENV"; do
            echo "$pair" >> "$GITHUB_OUTPUT"
          done

          if [ -z "$TE_FL_MODE" ] || [ -z "$TE_FL_TARGET_ARCH" ] || [ -z "$TE_FL_COMPILER" ] || \
             [ -z "$TE_FL_DEVICE_MODULE" ] || [ -z "$TE_FL_NATIVE_MODULE" ] || \
             [ -z "$TE_FL_EXPECTED_BACKEND" ] || [ "$TE_FL_BUILD_ENV" = "{}" ] || \
             [ "$TE_FL_RUNTIME_ENV" = "{}" ] || \
             [ "$TE_FL_RUNTIME_MODULES" = "[]" ] || \
             ! [[ "$TE_FL_REQUIRE_SHARED_LIBRARY" =~ ^(true|false)$ ]]; then
            echo "::error::incomplete te_fl contract in $CONFIG_FILE"
            exit 1
          fi

      
  te_fl_prepare:
    name: te_fl_prepare
    if: inputs.run_unit_tests || inputs.run_functional_tests || inputs.prepare_te_fl_only
    needs: checkout_and_config
    uses: ./.github/workflows/prepare_te_fl.yml
    with:
      platform: ${{ inputs.platform }}
      image: ${{ needs.checkout_and_config.outputs.ci_image }}
      runs_on: ${{ needs.checkout_and_config.outputs.runs_on }}
      container_volumes: ${{ needs.checkout_and_config.outputs.container_volumes }}
      container_options: ${{ needs.checkout_and_config.outputs.container_options }}
      setup_script: ${{ needs.checkout_and_config.outputs.setup_script }}
      nproc_per_node: ${{ needs.checkout_and_config.outputs.te_fl_prepare_nproc_per_node }}
      te_fl_ref: ${{ needs.checkout_and_config.outputs.te_fl_ref }}
      native_mode: ${{ needs.checkout_and_config.outputs.te_fl_mode }}
      target_arch: ${{ needs.checkout_and_config.outputs.te_fl_target_arch }}
      compiler: ${{ needs.checkout_and_config.outputs.te_fl_compiler }}
      require_shared_library: ${{ needs.checkout_and_config.outputs.te_fl_require_shared_library }}
      source_paths: ${{ needs.checkout_and_config.outputs.te_fl_source_paths }}
      build_files: ${{ needs.checkout_and_config.outputs.te_fl_build_files }}
      build_env: ${{ needs.checkout_and_config.outputs.te_fl_build_env }}
      build_pip_args: ${{ needs.checkout_and_config.outputs.te_fl_build_pip_args }}
      native_modules: ${{ needs.checkout_and_config.outputs.te_fl_native_modules }}
      runtime_modules: ${{ needs.checkout_and_config.outputs.te_fl_runtime_modules }}
      bootstrap_modules: ${{ needs.checkout_and_config.outputs.te_fl_bootstrap_modules }}
      native_module: ${{ needs.checkout_and_config.outputs.te_fl_native_module }}
      device_module: ${{ needs.checkout_and_config.outputs.te_fl_device_module }}
      expected_backend: ${{ needs.checkout_and_config.outputs.te_fl_expected_backend }}
      runtime_env: ${{ needs.checkout_and_config.outputs.te_fl_runtime_env }}
      install_pip_args: ${{ needs.checkout_and_config.outputs.te_fl_install_pip_args }}
      expected_te_fl_commit: ${{ needs.checkout_and_config.outputs.expected_te_fl_commit }}

  lint:
    name: lint
    if: ${{ !inputs.prepare_te_fl_only }}
    needs: 
      - checkout_and_config
    uses: ./.github/workflows/lint_common.yml
          
  unit_tests:
    name: unit_tests
    if: inputs.run_unit_tests
    needs: 
      - checkout_and_config
      - te_fl_prepare
      - lint
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.checkout_and_config.outputs.device_types) }}
    uses: ./.github/workflows/unit_tests_common.yml
    with:
      platform: ${{ inputs.platform }}
      device: ${{ matrix.device }}
      image: ${{ needs.checkout_and_config.outputs.ci_image }}
      runs_on: ${{ needs.checkout_and_config.outputs.runs_on }}
      container_volumes: ${{ needs.checkout_and_config.outputs.container_volumes }}
      container_options: ${{ needs.checkout_and_config.outputs.container_options }}
      setup_script: ${{ needs.checkout_and_config.outputs.setup_script }}
      test_groups: ${{ needs.checkout_and_config.outputs.unit_test_groups }}
      nproc_per_node: ${{ needs.checkout_and_config.outputs.unit_nproc_per_node }}
      pytest_extra_args: ${{ needs.checkout_and_config.outputs.unit_pytest_extra_args }}
      ignored_tests: ${{ needs.checkout_and_config.outputs.ignored_tests }}
      te_fl_commit: ${{ needs.te_fl_prepare.outputs.te_fl_commit }}
      te_fl_native_fingerprint: ${{ needs.te_fl_prepare.outputs.native_fingerprint }}
      te_fl_cache_key: ${{ needs.te_fl_prepare.outputs.cache_key }}
      te_fl_native_module: ${{ needs.checkout_and_config.outputs.te_fl_native_module }}
      te_fl_device_module: ${{ needs.checkout_and_config.outputs.te_fl_device_module }}
      te_fl_bootstrap_modules: ${{ needs.checkout_and_config.outputs.te_fl_bootstrap_modules }}
      te_fl_expected_backend: ${{ needs.checkout_and_config.outputs.te_fl_expected_backend }}
      te_fl_runtime_env: ${{ needs.checkout_and_config.outputs.te_fl_runtime_env }}
      te_fl_install_pip_args: ${{ needs.checkout_and_config.outputs.te_fl_install_pip_args }}

  unit_tests_complete:
    name: unit_tests_complete
    # Keep a successful gate when unit tests are disabled so functional tests
    # do not inherit a skipped dependency.
    if: always()
    needs: 
      - unit_tests
    runs-on: ubuntu-latest
    steps:
      - name: Check unit tests result
        run: |
          if [ "${{ inputs.run_unit_tests }}" != "true" ]; then
            echo "Unit tests disabled; allowing functional tests to proceed"
            exit 0
          fi
          if [ "${{ needs.unit_tests.result }}" != "success" ]; then
            echo "❌ Unit tests failed: ${{ needs.unit_tests.result }}"
            exit 1
          fi
          echo "✅ Unit tests passed"

  functional_tests:
    name: functional_tests
    if: >-
      always() &&
      inputs.run_functional_tests &&
      needs.checkout_and_config.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.unit_tests_complete.result == 'success' &&
      needs.te_fl_prepare.result == 'success'
    needs:
      - checkout_and_config
      - te_fl_prepare
      - lint
      - unit_tests_complete
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.checkout_and_config.outputs.device_types) }}
    uses: ./.github/workflows/functional_tests_common.yml
    with:
      platform: ${{ inputs.platform }}
      device: ${{ matrix.device }}
      image: ${{ needs.checkout_and_config.outputs.ci_image }}
      runs_on: ${{ needs.checkout_and_config.outputs.runs_on }}
      container_volumes: ${{ needs.checkout_and_config.outputs.container_volumes }}
      container_options: ${{ needs.checkout_and_config.outputs.container_options }}
      setup_script: ${{ needs.checkout_and_config.outputs.setup_script }}
      test_matrix: ${{ needs.checkout_and_config.outputs.train_test_matrix }}
      te_fl_commit: ${{ needs.te_fl_prepare.outputs.te_fl_commit }}
      te_fl_native_fingerprint: ${{ needs.te_fl_prepare.outputs.native_fingerprint }}
      te_fl_cache_key: ${{ needs.te_fl_prepare.outputs.cache_key }}
      te_fl_native_module: ${{ needs.checkout_and_config.outputs.te_fl_native_module }}
      te_fl_device_module: ${{ needs.checkout_and_config.outputs.te_fl_device_module }}
      te_fl_bootstrap_modules: ${{ needs.checkout_and_config.outputs.te_fl_bootstrap_modules }}
      te_fl_expected_backend: ${{ needs.checkout_and_config.outputs.te_fl_expected_backend }}
      te_fl_runtime_env: ${{ needs.checkout_and_config.outputs.te_fl_runtime_env }}
      te_fl_install_pip_args: ${{ needs.checkout_and_config.outputs.te_fl_install_pip_args }}

  functional_tests_complete:
    name: functional_tests_complete
    if: always() && inputs.run_functional_tests
    needs: 
      - functional_tests
    runs-on: ubuntu-latest
    steps:
      - name: Check functional tests result
        run: |
          if [ "${{ needs.functional_tests.result }}" != "success" ]; then
            echo "❌ Functional tests failed: ${{ needs.functional_tests.result }}"
            exit 1
          fi
          echo "✅ Functional tests passed"

  all_tests_complete:
    defaults:
      run:
        shell: bash
    needs:
      - checkout_and_config
      - te_fl_prepare
      - lint
      - unit_tests_complete
      - functional_tests_complete
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all tests passed
        run: |
          # Check all test jobs
          failed=false

          if [ "${{ needs.lint.result }}" != "success" ] && \
            [ "${{ needs.lint.result }}" != "skipped" ]; then
            echo "❌ Lint failed"
            failed=true
          fi

          if [ "${{ needs.te_fl_prepare.result }}" != "success" ] && \
            [ "${{ needs.te_fl_prepare.result }}" != "skipped" ]; then
            echo "❌ TE-FL prepare failed or cancelled: ${{ needs.te_fl_prepare.result }}"
            failed=true
          fi

          if [ "${{ needs.unit_tests_complete.result }}" != "success" ] && \
            [ "${{ needs.unit_tests_complete.result }}" != "skipped" ]; then
            echo "❌ Unit tests failed or cancelled: ${{ needs.unit_tests_complete.result }}"
            failed=true
          fi

          if [ "${{ needs.functional_tests_complete.result }}" != "success" ] && \
            [ "${{ needs.functional_tests_complete.result }}" != "skipped" ]; then
            echo "❌ Functional tests failed or cancelled: ${{ needs.functional_tests_complete.result }}"
            failed=true
          fi

          if [ "$failed" = "true" ]; then
            exit 1
          fi

          echo "✅ All tests completed successfully!"
