name: daily

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: te-fl-daily-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-cuda:
    name: prepare-cuda
    uses: ./.github/workflows/prepare_te_fl_cuda.yml

  prepare-musa:
    name: prepare-musa
    uses: ./.github/workflows/prepare_te_fl_musa.yml

  prepare-ascend:
    name: prepare-ascend
    uses: ./.github/workflows/prepare_te_fl_ascend.yml

  prepare-kunlunxin:
    name: prepare-kunlunxin
    uses: ./.github/workflows/prepare_te_fl_kunlunxin.yml

  prepare-hygon:
    name: prepare-hygon
    uses: ./.github/workflows/prepare_te_fl_hygon.yml

  prepare-metax:
    name: prepare-metax
    uses: ./.github/workflows/prepare_te_fl_metax.yml

  prepare-enflame:
    name: prepare-enflame
    uses: ./.github/workflows/prepare_te_fl_enflame.yml
