name: daily

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: te-fl-daily-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: prepare-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - cuda
    # Only CUDA builds TE-FL. Vendor platforms use the runtime supplied by
    # their images and do not need a daily compiler/cache warm-up job.
    uses: ./.github/workflows/all_tests_common.yml
    with:
      platform: ${{ matrix.platform }}
      run_unit_tests: false
      run_functional_tests: false
      prepare_te_fl_only: true
