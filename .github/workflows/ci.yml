# Unified CI entry point for Megatron-LM-FL.
#
# Pipeline: lint → generate-matrix → platform-pipeline (matrix) → ci-complete
#
# Platform discovery is config-driven: generate_matrix.py scans
# .github/configs/*.yml for platform names, then on pull_request events
# intersects the changed-file list against per-platform paths_watch so
# only affected platforms run.  All other events run the full matrix.

name: CI

on:
  schedule:
    - cron: '0 18 * * *'   # 02:00 CST daily
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'examples/**'
  pull_request:
    branches: [main, devops]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Common CI checks
    uses: ./.github/workflows/lint_common.yml
    with:
      base_ref: ${{ github.base_ref || 'main' }}

  generate-matrix:
    name: Generate platform matrix
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.matrix.outputs.platforms }}
      unit_matrix: ${{ steps.plan.outputs.unit_matrix }}
      plan_hash: ${{ steps.plan.outputs.plan_hash }}
      plan_status: ${{ steps.plan.outputs.plan_status }}
      expected_unit_groups: ${{ steps.plan.outputs.expected_unit_groups }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install matrix dependencies
        run: python -m pip install --quiet PyYAML==6.0.3
      - name: Compute platform matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          python .github/scripts/ci/generate_matrix.py \
            --event-name "$EVENT_NAME" \
            --base-ref "$BASE_REF" \
            --configs-dir .github/configs \
            >> "$GITHUB_OUTPUT"

      # The plan selects logical groups from the diff and materializes them
      # against each platform's configured execution groups. A directly affected
      # planned group or unknown path blocks execution; planned groups reached
      # only through a shared-path fallback expand to every executable group.
      - name: Generate unit test plan
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref || 'main' }}
          PLATFORMS: ${{ steps.matrix.outputs.platforms }}
        run: |
          python .github/scripts/ci/generate_test_plan.py \
            --event-name "$EVENT_NAME" \
            --base-ref "$BASE_REF" \
            --platforms "$PLATFORMS" \
            --output unit-test-plan.json \
            --summary "$GITHUB_STEP_SUMMARY" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload unit test plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-plan
          path: unit-test-plan.json
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  platform-pipeline:
    name: Platform pipeline (${{ matrix.platform }})
    needs: generate-matrix
    if: needs.generate-matrix.outputs.platforms != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.unit_matrix) }}
    uses: ./.github/workflows/_platform_pipeline.yml
    secrets:
      FLAGCICD_API_TOKEN: ${{ secrets.FLAGCICD_API_TOKEN }}
    with:
      platform: ${{ matrix.platform }}
      expected_unit_groups: ${{ toJson(matrix.groups) }}
      plan_hash: ${{ needs.generate-matrix.outputs.plan_hash }}

  ci-complete:
    name: CI Complete
    needs: [lint, generate-matrix, platform-pipeline]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Keep the gate independent of checkout and PR-controlled dependencies.
      - name: Verify required CI results
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          MATRIX_RESULT: ${{ needs.generate-matrix.result }}
          PLATFORMS: ${{ needs.generate-matrix.outputs.platforms }}
          PLAN_STATUS: ${{ needs.generate-matrix.outputs.plan_status }}
          PLAN_HASH: ${{ needs.generate-matrix.outputs.plan_hash }}
          PIPELINE_RESULT: ${{ needs.platform-pipeline.result }}
        run: |
          python3 - <<'PY'
          import json
          import os

          if os.environ['LINT_RESULT'] != 'success':
              raise SystemExit('Lint failed, was cancelled, or did not run')
          if os.environ['MATRIX_RESULT'] != 'success':
              raise SystemExit('Platform matrix generation did not succeed')
          platforms = json.loads(os.environ['PLATFORMS'])
          if not isinstance(platforms, list) or any(
              not isinstance(platform, str) or not platform for platform in platforms
          ):
              raise SystemExit('Invalid platform matrix')
          if platforms:
              if os.environ['PLAN_STATUS'] not in ('ready', 'partial'):
                  raise SystemExit(
                      'Unit plan must be ready or partial before platform jobs run'
                  )
              if not os.environ['PLAN_HASH'].startswith('sha256:'):
                  raise SystemExit('Unit plan hash is missing')
          expected = 'success' if platforms else 'skipped'
          if os.environ['PIPELINE_RESULT'] != expected:
              raise SystemExit(f'Platform pipeline must be {expected}')
          print('All required CI checks passed')
          PY

      - name: Download unit test plan
        if: needs.generate-matrix.result == 'success' && needs.generate-matrix.outputs.platforms != '[]'
        uses: actions/download-artifact@v4
        with:
          name: unit-test-plan
          path: unit-test-plan

      - name: Download unit execution attestations
        if: needs.generate-matrix.result == 'success' && needs.generate-matrix.outputs.platforms != '[]'
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: unit-results

      - name: Verify unit plan across platforms
        if: needs.generate-matrix.result == 'success' && needs.generate-matrix.outputs.platforms != '[]'
        env:
          PLAN_HASH: ${{ needs.generate-matrix.outputs.plan_hash }}
          EXPECTED_UNIT_GROUPS: ${{ needs.generate-matrix.outputs.expected_unit_groups }}
          UNIT_MATRIX: ${{ needs.generate-matrix.outputs.unit_matrix }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib

          plan = json.loads(
              pathlib.Path('unit-test-plan/unit-test-plan.json').read_text()
          )
          expected = json.loads(os.environ['EXPECTED_UNIT_GROUPS'])
          matrix = json.loads(os.environ['UNIT_MATRIX'])
          if plan['plan_status'] not in ('ready', 'partial'):
              raise SystemExit(f"Unit plan is not executable: {plan['plan_status']}")
          if plan['plan_hash'] != os.environ['PLAN_HASH']:
              raise SystemExit('Plan hash output does not match the uploaded plan')
          if plan['expected_unit_groups'] != expected:
              raise SystemExit('Expected groups output does not match the uploaded plan')
          matrix_groups = {}
          for entry in matrix:
              name = entry.get('platform')
              if name in matrix_groups:
                  raise SystemExit(f'Duplicate platform in unit matrix: {name}')
              matrix_groups[name] = entry.get('groups')
          if matrix_groups != expected:
              raise SystemExit('Unit matrix does not match expected groups')
          devices = {
              (platform['name'], device)
              for platform in plan['platforms']
              for device in platform['devices']
          }
          results = {}
          for path in pathlib.Path('unit-results').rglob('unit-results.json'):
              data = json.loads(path.read_text())
              key = (data.get('platform'), data.get('device'))
              if key in results:
                  raise SystemExit(f'Duplicate unit result attestation: {key}')
              results[key] = data
          if set(results) != devices:
              raise SystemExit(
                  'Unit result attestations do not match planned platforms/devices: '
                  f"missing={sorted(devices - set(results))}, "
                  f"unexpected={sorted(set(results) - devices)}"
              )
          for key, data in sorted(results.items()):
              groups = expected[key[0]]
              if data.get('plan_hash') != plan['plan_hash']:
                  raise SystemExit(f'Plan hash mismatch for {key}')
              if data.get('expected_groups') != groups:
                  raise SystemExit(f'Expected group mismatch for {key}')
              if data.get('executed_groups') != groups:
                  raise SystemExit(f'Executed group mismatch for {key}')
              if data.get('missing_groups') or data.get('unexpected_groups'):
                  raise SystemExit(f'Group execution mismatch for {key}')
              if data.get('status') != 'passed':
                  raise SystemExit(f"Unit execution did not pass for {key}: {data.get('status')}")
          print(f'Unit plan verified across {len(results)} platform/device results')
          PY
