# Unified CI entry point for Megatron-LM-FL.
#
# Pipeline: lint → generate-matrix → platform-pipeline (matrix) → ci-complete
#
# The registered baseline runs in full by default. ci:diff explicitly opts PRs
# into platform routing; platform labels only add coverage. Plans freeze every
# required group/case and all final results are checked against that plan.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'examples/**'
  pull_request:
    branches: [main, devops]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Common CI checks
    uses: ./.github/workflows/lint_common.yml
    with:
      base_ref: ${{ github.base_ref || 'main' }}

  generate-matrix:
    name: Generate platform matrix
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.matrix.outputs.platforms }}
      metadata: ${{ steps.matrix.outputs.metadata }}
      source_sha: ${{ steps.matrix.outputs.source_sha }}
      run_unit_tests: ${{ steps.matrix.outputs.run_unit_tests }}
      run_functional_tests: ${{ steps.matrix.outputs.run_functional_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install matrix dependencies
        run: python -m pip install --quiet PyYAML==6.0.3
      - name: Compute platform matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          python .github/scripts/ci/flagcicd.py plan --output flagcicd-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: flagcicd-plan
          path: flagcicd-plan.json
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  platform-pipeline:
    name: Platform pipeline (${{ matrix.platform }})
    needs: generate-matrix
    if: needs.generate-matrix.outputs.platforms != '[]'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.generate-matrix.outputs.platforms) }}
    uses: ./.github/workflows/_platform_pipeline.yml
    secrets:
      FLAGCICD_API_TOKEN: ${{ secrets.FLAGCICD_API_TOKEN }}
    with:
      platform: ${{ matrix.platform }}
      source_ref: ${{ needs.generate-matrix.outputs.source_sha }}
      run_unit_tests: ${{ fromJson(needs.generate-matrix.outputs.metadata).platform_plans[matrix.platform].run_unit_tests }}
      run_functional_tests: ${{ fromJson(needs.generate-matrix.outputs.metadata).platform_plans[matrix.platform].run_functional_tests }}
      flagcicd_metadata: ${{ needs.generate-matrix.outputs.metadata }}

  ci-complete:
    name: CI Complete
    needs: [lint, generate-matrix, platform-pipeline]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Keep the gate independent of checkout and PR-controlled dependencies.
      - name: Verify required CI results
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          MATRIX_RESULT: ${{ needs.generate-matrix.result }}
          PLATFORMS: ${{ needs.generate-matrix.outputs.platforms }}
          PIPELINE_RESULT: ${{ needs.platform-pipeline.result }}
        run: |
          python3 - <<'PY'
          import json
          import os

          if os.environ['LINT_RESULT'] != 'success':
              raise SystemExit('Lint failed, was cancelled, or did not run')
          if os.environ['MATRIX_RESULT'] != 'success':
              raise SystemExit('Platform matrix generation did not succeed')
          platforms = json.loads(os.environ['PLATFORMS'])
          if not isinstance(platforms, list) or any(
              not isinstance(platform, str) or not platform for platform in platforms
          ):
              raise SystemExit('Invalid platform matrix')
          expected = 'success' if platforms else 'skipped'
          if os.environ['PIPELINE_RESULT'] != expected:
              raise SystemExit(f'Platform pipeline must be {expected}')
          print('All required CI checks passed')
          PY

      - uses: actions/checkout@v4
        if: always()
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: always()
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet PyYAML==6.0.3
        if: always()
      - name: Download resolved plan
        if: always() && needs.generate-matrix.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: flagcicd-plan
      - name: Download platform reports
        if: always() && needs.generate-matrix.outputs.platforms != '[]'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: flagcicd-report-*
          path: flagcicd-reports
          merge-multiple: true
      - name: Aggregate and verify required results
        if: always()
        env:
          JOB_RESULTS: >-
            {"configuration":"${{ needs.generate-matrix.result }}","lint":"${{ needs.lint.result }}","platforms":"${{ needs.platform-pipeline.result }}"}
        run: >-
          python .github/scripts/ci/flagcicd.py aggregate
          --input flagcicd-plan.json --output flagcicd-run-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flagcicd-run-summary
          overwrite: true
          path: flagcicd-run-summary.json
          if-no-files-found: error
          retention-days: 14
