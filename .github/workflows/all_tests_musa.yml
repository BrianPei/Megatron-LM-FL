name: s5000_tests

on:
  push:
    branches: ["main", "dev", "dev-musa"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      image_override:
        description: >-
          Optional immutable image override. Replaces ci_image in artifact mode
          and the prebuilt runtime image in image mode.
        required: false
        type: string
        default: ''
      expected_te_fl_commit:
        description: 'Expected TE-FL commit SHA (40 hex chars)'
        required: false
        type: string
        default: ''
      run_unit_tests:
        description: 'Run unit tests'
        required: false
        type: boolean
        default: true
      run_functional_tests:
        description: 'Run functional tests'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  run_tests:
    # Package manager and environment settings are read from .github/configs/musa.yml
    uses: ./.github/workflows/all_tests_common.yml
    with:
      platform: musa
      run_unit_tests: ${{ github.event.inputs.run_unit_tests != 'false' }}
      run_functional_tests: ${{ github.event.inputs.run_functional_tests != 'false' }}
      image_override: ${{ github.event.inputs.image_override || '' }}
      expected_te_fl_commit: ${{ github.event.inputs.expected_te_fl_commit || '' }}

  all_tests:
    needs: run_tests
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify workflow status
        run: |
          if [ "${{ needs.run_tests.result }}" != "success" ]; then
            echo "❌ Tests workflow failed"
            exit 1
          fi
          echo "✅ All tests passed!"
