name: Build Docker Images

on:
  pull_request:
    paths:
      - 'docker/**'
      - '.github/workflows/build_images.yml'
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - ci-all
    paths:
      - 'docker/**'
      - '.github/workflows/build_images.yml'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build (comma-separated or "all")'
        required: true
        default: 'all'
        type: string
      force_rebuild:
        description: 'Force rebuild without cache'
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [te-fl-updated]

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==============================================================================
  # Job 1: Detect changed platforms
  # ==============================================================================
  detect-platforms:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      should_build: ${{ steps.set-matrix.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed platforms
        id: set-matrix
        run: |
          set -euo pipefail

          # Determine which platforms to build
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PLATFORMS="${{ github.event.inputs.platforms }}"
          elif [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            # TE-FL update: build all platforms
            PLATFORMS="all"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            # On main/ci-all push, check changed files
            CHANGED=$(git diff --name-only HEAD~1 HEAD | grep '^docker/' || true)

            if echo "$CHANGED" | grep -q '^docker/versions.yaml$'; then
              # versions.yaml changed: build all
              PLATFORMS="all"
            else
              # Detect changed platform directories
              PLATFORMS=$(echo "$CHANGED" | grep -oP 'docker/\K[^/]+(?=/)' | sort -u | tr '\n' ',' | sed 's/,$//')
              # Filter out 'common'
              PLATFORMS=$(echo "$PLATFORMS" | tr ',' '\n' | grep -v '^common$' | tr '\n' ',' | sed 's/,$//')
            fi
          else
            # PR: check changed files in this PR
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '^docker/' || true)

            if echo "$CHANGED" | grep -q '^docker/versions.yaml$'; then
              PLATFORMS="all"
            else
              PLATFORMS=$(echo "$CHANGED" | grep -oP 'docker/\K[^/]+(?=/)' | sort -u | tr '\n' ',' | sed 's/,$//')
              PLATFORMS=$(echo "$PLATFORMS" | tr ',' '\n' | grep -v '^common$' | tr '\n' ',' | sed 's/,$//')
            fi
          fi

          # Expand "all" to actual platform list
          ALL_PLATFORMS="cuda,musa,metax,ascend,hygon,kunlunxin,enflame"

          if [[ "$PLATFORMS" == "all" ]]; then
            PLATFORMS="$ALL_PLATFORMS"
          fi

          # Convert to JSON array
          if [[ -n "$PLATFORMS" ]]; then
            MATRIX=$(echo "$PLATFORMS" | jq -R 'split(",") | map(select(length > 0))' | jq -c)
            SHOULD_BUILD="true"
          else
            MATRIX='[]'
            SHOULD_BUILD="false"
          fi

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT

          echo "Platforms to build: $PLATFORMS"
          echo "Matrix: $MATRIX"

  # ==============================================================================
  # Job 2: Validate versions.yaml
  # ==============================================================================
  validate-versions:
    runs-on: ubuntu-latest
    needs: detect-platforms
    if: needs.detect-platforms.outputs.should_build == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate versions.yaml
        run: |
          python3 - <<'PY'
          import yaml, sys, re

          with open("docker/versions.yaml") as f:
              cfg = yaml.safe_load(f)

          errors = []

          # Validate TE-FL commit
          te_commit = cfg.get("te_fl", {}).get("commit", "")
          if not te_commit:
              errors.append("te_fl.commit is empty")
          elif not re.match(r'^[0-9a-f]{40}$', te_commit):
              errors.append(f"te_fl.commit invalid format: {te_commit}")

          # Validate platforms
          platforms = cfg.get("platforms", {})
          if not platforms:
              errors.append("No platforms configured")

          for platform, config in platforms.items():
              if not config.get("base_image"):
                  errors.append(f"{platform}: base_image not configured")
              if not config.get("torch_version"):
                  errors.append(f"{platform}: torch_version not configured")
              if not config.get("python_version"):
                  errors.append(f"{platform}: python_version not configured")

          if errors:
              print("Validation errors:")
              for err in errors:
                  print(f"  - {err}")
              sys.exit(1)

          print("OK: versions.yaml validated successfully")
          PY

  # ==============================================================================
  # Job 3: Build images
  # ==============================================================================
  build-image:
    runs-on: ${{ matrix.runner }}
    needs: [detect-platforms, validate-versions]
    if: needs.detect-platforms.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: cuda
            runner: ubuntu-latest
          - platform: musa
            runner: [self-hosted, mt-8g-cicd-megatron]
          - platform: metax
            runner: [self-hosted, mx-8g-cicd-megatron]
          - platform: ascend
            runner: [self-hosted, flagcicd-910c]
          - platform: hygon
            runner: [self-hosted, hy-8g-cicd-megatron]
          - platform: kunlunxin
            runner: [self-hosted, kl-8g-cicd-megatron]
          - platform: enflame
            runner: [self-hosted, sy-8g-cicd-megatron]
    steps:
      - uses: actions/checkout@v4

      - name: Filter matrix by detected platforms
        id: filter
        run: |
          DETECTED='${{ needs.detect-platforms.outputs.matrix }}'
          CURRENT_PLATFORM='${{ matrix.platform }}'

          if echo "$DETECTED" | jq -e --arg p "$CURRENT_PLATFORM" 'any(. == $p)' > /dev/null; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.filter.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        if: steps.filter.outputs.should_run == 'true'
        run: pip install pyyaml

      - name: Build image
        if: steps.filter.outputs.should_run == 'true'
        id: build
        run: |
          cd docker

          NO_CACHE=""
          if [[ "${{ github.event.inputs.force_rebuild }}" == "true" ]]; then
            NO_CACHE="1"
          fi

          PLATFORM=${{ matrix.platform }} \
          TARGET=ci \
          NO_CACHE="$NO_CACHE" \
          bash build.sh | tee build.log

          # Extract image name from build output
          IMAGE=$(tail -1 build.log)
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

          # Save manifest path
          MANIFEST=$(ls .manifest-${{ matrix.platform }}-ci.json)
          echo "manifest=$MANIFEST" >> $GITHUB_OUTPUT

      - name: Run smoke test
        if: steps.filter.outputs.should_run == 'true'
        run: |
          IMAGE="${{ steps.build.outputs.image }}"

          echo "Running smoke test in container..."
          docker run --rm "$IMAGE" smoke_test.sh

      - name: Tag candidate image
        if: steps.filter.outputs.should_run == 'true' && github.event_name == 'pull_request'
        run: |
          IMAGE="${{ steps.build.outputs.image }}"
          CANDIDATE_TAG="candidate-pr${{ github.event.pull_request.number }}-${{ matrix.platform }}"
          CANDIDATE_IMAGE="harbor.baai.ac.cn/megatron-ci/${{ matrix.platform }}:${CANDIDATE_TAG}"

          docker tag "$IMAGE" "$CANDIDATE_IMAGE"
          echo "Candidate image tagged: $CANDIDATE_IMAGE"
          echo "candidate_image=$CANDIDATE_IMAGE" >> $GITHUB_OUTPUT

      - name: Upload manifest
        if: steps.filter.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.platform }}
          path: docker/.manifest-${{ matrix.platform }}-ci.json
          retention-days: 30

      - name: Login to Harbor
        if: steps.filter.outputs.should_run == 'true' && (github.event_name == 'push' || github.event_name == 'repository_dispatch')
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | \
          docker login harbor.baai.ac.cn -u "${{ secrets.HARBOR_USERNAME }}" --password-stdin

      - name: Push stable image
        if: steps.filter.outputs.should_run == 'true' && (github.event_name == 'push' || github.event_name == 'repository_dispatch')
        run: |
          IMAGE="${{ steps.build.outputs.image }}"
          docker push "$IMAGE"

          # Get digest
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" | cut -d'@' -f2)
          echo "Image pushed: $IMAGE"
          echo "Digest: $DIGEST"
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

  # ==============================================================================
  # Job 4: Summary
  # ==============================================================================
  summary:
    runs-on: ubuntu-latest
    needs: [detect-platforms, build-image]
    if: always() && needs.detect-platforms.outputs.should_build == 'true'
    steps:
      - name: Download all manifests
        uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          path: manifests/

      - name: Generate summary
        run: |
          echo "# Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Event:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Ref:** ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Built Images" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          for manifest in manifests/manifest-*/*.json; do
            if [[ -f "$manifest" ]]; then
              platform=$(jq -r '.platform' "$manifest")
              image=$(jq -r '.image' "$manifest")
              te_commit=$(jq -r '.te_fl_commit' "$manifest")

              echo "- **${platform}**: \`${image}\`" >> $GITHUB_STEP_SUMMARY
              echo "  - TE-FL: ${te_commit:0:8}" >> $GITHUB_STEP_SUMMARY
            fi
          done
