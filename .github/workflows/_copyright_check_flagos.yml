name: FlagOS Copyright Check

on:
  workflow_call:

jobs:
  flagos-copyright-check:
    name: copyright-check (FlagOS)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check changed Python copyright headers
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          changed_list="$RUNNER_TEMP/copyright-changed-files"
          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA...$HEAD_SHA" -- \
            ':(glob)megatron/core/**/*.py' ':(glob)tests/**/*.py' > "$changed_list"

          if [[ ! -s "$changed_list" ]]; then
            echo "No changed Python files require a copyright check."
            exit 0
          fi

          changed_files=()
          while IFS= read -r -d '' file; do
            changed_files+=("$file")
          done < "$changed_list"

          printf 'Checking copyright header: %s\n' "${changed_files[@]}"
          python3 tools/check_copyright.py "${changed_files[@]}"
