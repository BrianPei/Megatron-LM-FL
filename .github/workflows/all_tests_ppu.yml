name: ppu_tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run_tests:
    name: run-tests
    # Dependencies are fixed in the PPU image, so no per-run TE-FL build is needed.
    uses: ./.github/workflows/all_tests_common.yml
    with:
      platform: ppu
      run_unit_tests: true
      run_functional_tests: false
      te_fl_prepare: false

  all_tests:
    needs: run_tests
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify PPU unit-test workflow status
        env:
          TEST_STATUS: ${{ needs.run_tests.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$TEST_STATUS" != success ]; then
            echo "::error::PPU unit-test workflow failed: $TEST_STATUS"
            exit 1
          fi
          echo "PPU CI passed for the configured unit-test scope."
