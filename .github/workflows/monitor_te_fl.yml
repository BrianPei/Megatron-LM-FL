name: Monitor TE-FL Updates

on:
  schedule:
    # Check for TE-FL updates every 6 hours (avoid :00 and :30)
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      te_commit:
        description: 'TE-FL commit SHA to test (optional, defaults to latest)'
        required: false
        type: string

concurrency:
  group: monitor-te-fl
  cancel-in-progress: false

jobs:
  check-updates:
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      new_commit: ${{ steps.check.outputs.new_commit }}
      current_commit: ${{ steps.check.outputs.current_commit }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Check for TE-FL updates
        id: check
        run: |
          set -euo pipefail

          # Read current TE-FL commit from versions.yaml
          CURRENT_COMMIT=$(python3 -c "
          import yaml
          with open('docker/versions.yaml') as f:
              cfg = yaml.safe_load(f)
          print(cfg['te_fl']['commit'])
          ")

          echo "current_commit=$CURRENT_COMMIT" >> $GITHUB_OUTPUT

          # Determine target commit
          if [[ -n "${{ github.event.inputs.te_commit }}" ]]; then
            NEW_COMMIT="${{ github.event.inputs.te_commit }}"
            echo "Using manually specified commit: $NEW_COMMIT"
          else
            # Fetch latest commit from TE-FL main branch
            WATCH_BRANCH=$(python3 -c "
            import yaml
            with open('docker/versions.yaml') as f:
                cfg = yaml.safe_load(f)
            print(cfg['te_fl'].get('watch_branch', 'main'))
            ")

            TE_FL_REPO=$(python3 -c "
            import yaml
            with open('docker/versions.yaml') as f:
                cfg = yaml.safe_load(f)
            print(cfg['te_fl']['repository'])
            ")

            echo "Fetching latest commit from $TE_FL_REPO ($WATCH_BRANCH)..."

            NEW_COMMIT=$(git ls-remote "$TE_FL_REPO" "refs/heads/$WATCH_BRANCH" | cut -f1)
          fi

          echo "new_commit=$NEW_COMMIT" >> $GITHUB_OUTPUT

          # Check if update needed
          if [[ "$CURRENT_COMMIT" == "$NEW_COMMIT" ]]; then
            echo "has_update=false" >> $GITHUB_OUTPUT
            echo "OK: Already up to date: $CURRENT_COMMIT"
          else
            echo "has_update=true" >> $GITHUB_OUTPUT
            echo "UPDATE: Update available:"
            echo "   Current: $CURRENT_COMMIT"
            echo "   New:     $NEW_COMMIT"
          fi

  create-update-pr:
    runs-on: ubuntu-latest
    needs: check-updates
    if: needs.check-updates.outputs.has_update == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Update versions.yaml
        run: |
          NEW_COMMIT="${{ needs.check-updates.outputs.new_commit }}"

          # Update TE-FL commit (artifacts will be updated after build succeeds)
          python3 - <<PY
          import yaml

          with open('docker/versions.yaml') as f:
              cfg = yaml.safe_load(f)

          cfg['te_fl']['commit'] = "$NEW_COMMIT"

          # Clear artifacts (will be filled by build workflow)
          for platform in cfg['platforms']:
              cfg['platforms'][platform]['te_fl_artifact'] = ""

          with open('docker/versions.yaml', 'w') as f:
              yaml.dump(cfg, f, default_flow_style=False, sort_keys=False)
          PY

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update TE-FL to ${{ needs.check-updates.outputs.new_commit }}"
          branch: auto/update-te-fl-${{ needs.check-updates.outputs.new_commit }}
          delete-branch: true
          title: "[Auto] Update TE-FL to ${{ needs.check-updates.outputs.new_commit }}"
          body: |
            ## TE-FL Version Update

            This PR updates TransformerEngine-FL to a new version.

            **Current commit:** `${{ needs.check-updates.outputs.current_commit }}`
            **New commit:** `${{ needs.check-updates.outputs.new_commit }}`

            ### Changes

            - Updated `docker/versions.yaml` with new TE-FL commit
            - Platform artifacts will be built and updated automatically

            ### Validation

            The CI workflow will:
            1. Build new images for all platforms with the new TE-FL version
            2. Run smoke tests to verify TE-FL installation
            3. Execute unit and functional tests

            ### Manual Review Required

            Please review:
            - [ ] TE-FL changelog for breaking changes
            - [ ] CI test results for all platforms
            - [ ] Any platform-specific compatibility issues

            ---
            *This PR was created automatically by the TE-FL update monitor.*
          labels: |
            auto-update
            te-fl
            infrastructure
          draft: false

      - name: Trigger image build
        if: success()
        run: |
          # The create-pull-request action will trigger build_images.yml automatically
          echo "OK: PR created, image build will start automatically"
