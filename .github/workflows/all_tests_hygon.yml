name: hygon_tests

on:
  workflow_dispatch: # Allows manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  run_tests:
    uses: ./.github/workflows/all_tests_common.yml
    with:
      platform: hygon
      run_unit_tests: true
      # Enable after BW1000 dataset mounts and golden values are validated.
      run_functional_tests: false

  all_tests:
    needs: run_tests
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify workflow status
        run: |
          if [ "${{ needs.run_tests.result }}" != "success" ]; then
            echo "Hygon tests workflow failed"
            exit 1
          fi
          echo "All Hygon tests passed"
