# MUSA Hardware Configuration for Megatron-LM-FL
# This file defines CI/CD settings for Moore Threads MUSA-based unit testing.

hardware_name: musa
display_name: 'S5000 Tests'
setup_script: .github/scripts/set_env_musa.sh
nproc_per_node: 8

# Runner labels for Moore Threads node
runner_labels:
  - mt-8g-cicd-megatron
# CI image for online env
ci_image: registry.mthreads.com/presale/devtech/flagsclae:0206

# Dataset/tokenizer volumes for test data
container_volumes:
  - /home/flagscale_cicd/flask/static:/workspace/report
  - /home/flagscale_cicd/flask/config:/workspace/config
  - /home/flagscale_cicd/docker/docker_build/docker_data:/home/gitlab-runner/data
  - /home/flagscale_cicd/docker/docker_build/docker_tokenizers:/home/gitlab-runner/tokenizers
  - /home/flagscale_cicd/docker/docker_build/docker_data/Megatron-LM/datasets:/opt/data/datasets
  - /home/flagscale_cicd/docker/docker_build/docker_tokenizers/Megatron-LM/tokenizers:/opt/data/tokenizers
  # Override broken libmusa.so stub inside the image.
  - /usr/lib/x86_64-linux-gnu/libmusa.so:/usr/lib/x86_64-linux-gnu/libmusa.so
  - /usr/lib/x86_64-linux-gnu/libmusa.so.1:/usr/lib/x86_64-linux-gnu/libmusa.so.1
  - /usr/lib/x86_64-linux-gnu/libmusa.so.4.3.5:/usr/lib/x86_64-linux-gnu/libmusa.so.4.3.5
  # Mount MUSA driver runtime libraries.
  - /usr/local/musa-4.3.4:/usr/local/musa-4.3.4

# Container options (hardware-specific settings)
container_options: >-
  --privileged
  --shm-size=500g
  --hostname megatron_cicd
  --user root
  --ulimit nofile=65535:65535

# Device types to run tests on
device_types:
  - s5000

# Test matrix configuration
test_matrix:
  unit:
    devices:
      - s5000
    pytest_extra_args: []
    groups:
      - name: core
        path: tests/unit_tests/test_*.py
        description: Core unit tests
      - name: models
        path: tests/unit_tests/models/
        description: Model tests
      - name: distributed
        path: tests/unit_tests/distributed/
        description: Distributed tests
      - name: dist_checkpointing
        path: tests/unit_tests/dist_checkpointing/
        description: Distributed checkpointing tests
      - name: tensor_parallel
        path: tests/unit_tests/tensor_parallel/
        description: Tensor parallel tests
      - name: pipeline_parallel
        path: tests/unit_tests/pipeline_parallel/
        description: Pipeline parallel tests
      - name: data
        path: tests/unit_tests/data/
        description: Data tests
      - name: fusions
        path: tests/unit_tests/fusions/
        description: Fusion tests
      - name: others
        path: tests/unit_tests/export/ tests/unit_tests/post_training/ tests/unit_tests/tokenizers/ tests/unit_tests/utils/
        description: Export, post-training, tokenizer, and utility tests
    # Start with a conservative MUSA smoke set while validating runtime and TE plugin coverage.
    ignored_tests:
      # ── Core tests that genuinely require CUDA/NCCL/Apex/TE GPU paths ──────────
      - tests/unit_tests/test_fp8_param.py          # FP8 training with TE + CUDA graphs
      - tests/unit_tests/test_fp8_utils.py           # TestFP8Padding needs CUDA/TE
      - tests/unit_tests/test_fp4_param.py           # NVFP4 requires Blackwell+ TE
      - tests/unit_tests/test_imports.py             # Import chains hit TE/CUDA modules
      - tests/unit_tests/test_nccl_allocator.py      # NCCL-specific memory allocator
      - tests/unit_tests/test_local_multi_tensor_fns.py  # Apex amp_C CUDA kernels
      - tests/unit_tests/test_muon_optimizer.py      # Hardcoded device='cuda', Newton-Schulz
      - tests/unit_tests/test_optimizer.py           # FusedAdam + fp8_autocast + DDP
      - tests/unit_tests/test_optimizer_cpu_offloading.py  # CPU-GPU offloading, .cuda()
      - tests/unit_tests/test_layer_wise_optimizer.py      # .cuda() + multi-rank
      - tests/unit_tests/test_inference.py           # InferenceEngineHarness + Flask
      # ── Import chain risk: megatron.training.arguments → TE/CUDA modules ───────
      - tests/unit_tests/test_api_backwards_compat_setup.py::test_decorator_module
      - tests/unit_tests/test_api_backwards_compat_setup.py::test_decorators_work
      # core-TCP store teardown leaves residual sockets that cause
      # 60s timeouts between destroy/init cycles.  Skip the whole file
      # (same approach as Metax).
      - tests/unit_tests/test_parallel_state.py
      # These core tests enter MCCL default-process-group collectives that
      # currently time out while exchanging McclUniqueId on the MUSA image.
      - tests/unit_tests/test_process_groups_config.py::TestPGConfigDefaultInitialization::test_default_initialization
      - tests/unit_tests/test_training.py::TestTraining::test_build_train_valid_test_data_iterators
      - tests/unit_tests/test_training.py::TestTraining::test_closed_formula_vocab_size_with_padding
      - tests/unit_tests/test_training.py::TestSaveGrads::test_save_grads
      # PyTorch 2.5 _coalescing_manager compatibility issue with MUSA torch_musa
      # Mocked all_reduce returns None → op_list empty → work never assigned → UnboundLocalError
      - tests/unit_tests/distributed/test_param_and_grad_buffer.py::test_force_all_reduce_uses_correct_collective[False]
      - tests/unit_tests/distributed/test_param_and_grad_buffer.py::test_force_all_reduce_uses_correct_collective[True]
      # distributed-bucket_group_cpu_sync produces different numerical results on MUSA.
      - tests/unit_tests/distributed/test_param_and_grad_buffer.py::test_manual_bucket_group_cpu_sync_partition_and_buffer_helpers
      # The eight-rank DDP process-group case times out during MCCL initialization;
      # later distributed failures are cascading rank desynchronization.
      - tests/unit_tests/distributed/test_distributed_data_parallel.py::TestDistributedDataParallel::test_ddp_with_dp_process_groups[8]
      # reduce_scatter with fp32 accumulation can SIGSEGV on rank 5 in the MUSA
      # runtime for this parameter combination; other combinations remain enabled.
      - tests/unit_tests/distributed/test_reduce_scatter_with_fp32_accumulation.py::TestReduceScatterWithFP32Accumulation::test_reduce_scatter_with_fp32_accumulation[False-True]
      # This MoE expert reconfiguration crashes rank 5 in the MUSA runtime;
      # the preceding source/destination layouts remain enabled.
      - tests/unit_tests/dist_checkpointing/models/test_moe_experts.py::TestExpertLayerReconfiguration::test_parallel_reconfiguration_e2e[True-tp-ep-dp-pp-tp-ep-dp-pp-sequential-False-src_tp_pp_ep_etp2-dest_tp_pp_ep_etp2-False]
      # fused_layer_norm_cuda (Apex CUDA kernel) not available in MUSA image;
      # test_pipeline_layout.py invokes GPT forward which enters fused_layer_norm
      - tests/unit_tests/pipeline_parallel/test_pipeline_layout.py
      # test_forward_backward_func_with_pipeline_parallel calls torch.rand(...).cuda() in test code
      - tests/unit_tests/pipeline_parallel/test_schedules.py::test_forward_backward_func_with_pipeline_parallel
      # pipeline_parallel-MCCL TCP store initialization times out intermittently.
      - tests/unit_tests/pipeline_parallel/test_schedules.py::test_get_forward_backward_func
      - tests/unit_tests/pipeline_parallel/test_schedules.py::test_forward_backward_func_with_interleaving
      - tests/unit_tests/pipeline_parallel/test_schedules.py::test_forward_backward_func_with_uneven_interleaving
      - tests/unit_tests/pipeline_parallel/test_schedules.py::test_forward_backward_pipelining_without_interleaving_with_custom_pgs
      - tests/unit_tests/pipeline_parallel/test_schedules.py::test_forward_backward_pipelining_with_interleaving_with_custom_pgs
      - tests/unit_tests/pipeline_parallel/test_schedules.py::test_forward_backward_func_without_pipeline_parallel
      # tensor_parallel-MCCL communicator setup times out while exchanging
      # McclUniqueId on the MUSA image; keep the other tensor-parallel tests enabled.
      - tests/unit_tests/tensor_parallel/test_cross_entropy.py::test_vocab_parallel_cross_entropy
      - tests/unit_tests/tensor_parallel/test_data.py::test_broadcast_data
      - tests/unit_tests/tensor_parallel/test_layers.py::test_LinearWithFrozenWeight[1-False]
      - tests/unit_tests/tensor_parallel/test_layers.py::test_LinearWithFrozenWeight[8-True]
      - tests/unit_tests/tensor_parallel/test_random.py::test_model_parallel_cuda_manual_seed
      - tests/unit_tests/tensor_parallel/test_mappings.py::test_CopyToModelParallelRegion
      - tests/unit_tests/tensor_parallel/test_mappings.py::test_ReduceFromModelParallelRegion
      - tests/unit_tests/tensor_parallel/test_mappings.py::test_ScatterToModelParallelRegion
      - tests/unit_tests/tensor_parallel/test_mappings.py::test_GatherFromModelParallelRegion
      - tests/unit_tests/tensor_parallel/test_mappings.py::test_ScatterToSequenceParallelRegion
      - tests/unit_tests/tensor_parallel/test_mappings.py::test_GatherFromSequenceParallelRegion
      - tests/unit_tests/tensor_parallel/test_mappings.py::test_ReduceScatterToSequenceParallelRegion
      - tests/unit_tests/tensor_parallel/test_tensor_parallel_utils.py::test_gather_split_1d_tensor
      # fusions-torch_musa missing aten::empty.memory_format CUDA kernel in clamped swiglu path.
      - tests/unit_tests/fusions/test_swiglu_fusion.py::test_clamped_weighted_bias_swiglu
      # test_bin_reader downloads GPT2 tokenizer from s3.amazonaws.com, unreachable from MUSA CI
      - tests/unit_tests/data/test_bin_reader.py
      # test_fast_builder expands to 192 distributed cases and repeatedly rebuilds
      # datasets across eight ranks. The accumulated MCCL barriers eventually
      # SIGSEGV on MUSA, while the preceding parameter combinations pass.
      - tests/unit_tests/data/test_builder.py::test_fast_builder
      # post_training-MCCL TCP store initialization times out intermittently.
      - tests/unit_tests/post_training/test_modelopt_module_spec.py::TestModelOptMLAMoE::test_sharded_state_dict_restore
      - tests/unit_tests/post_training/test_modelopt_module_spec.py::TestModelOptLlama4MoE::test_sharded_state_dict_restore
      - tests/unit_tests/post_training/test_modelopt_module_spec.py::TestModelOptGPTModel::test_sharded_state_dict_restore
      # TestModelOptMambaModel requires mamba-ssm (CUDA-compiled SSM library) not present in MUSA image
      - tests/unit_tests/post_training/test_modelopt_module_spec.py::TestModelOptMambaModel
      # test_checkpointing: _load_base_checkpoint → read_metadata uses device='cuda' tensor
      - tests/unit_tests/test_checkpointing.py
      # test_bert_model: TE layernorm_fwd reference impl calls tensor.to(odtype) where torch_musa
      # _to() misinterprets DType enum as device ID → "Invalid device string: 'musa:DType.kFloat32'"
      - tests/unit_tests/models/test_bert_model.py::TestBertModel::test_post_process_forward
      # The heterogeneous constructor parametrization allocates 1.31B-1.49B
      # parameter full-size models on every rank. On MUSA, repeated model-parallel
      # teardown can wait 60s in TCPStore/MCCL, causing the models job to time out.
      - tests/unit_tests/models/test_heterogeneous_gpt_model.py::TestHeterogeneousGPTModel::test_constructor
      # others-ExperimentalFeature logging does not populate log records on MUSA.
      - tests/unit_tests/utils/test_experimental_log_once.py::test_experimental_fn_logs_once
      - tests/unit_tests/utils/test_experimental_log_once.py::test_experimental_cls_logs_once
      # others-Attempts to download gpt2 tokenizer from huggingface.co, unreachable.
      - tests/unit_tests/tokenizers/test_tokenizer.py::test_megatron_tokenizer
      # data-Attempts to download gpt2 tokenizer from huggingface.co, unreachable.
      - tests/unit_tests/data/test_preprocess_mmdata.py::test_preprocess_mmdata

  functional:
    train:
      - model: gpt
        test_case: qwen3_0p6b_mcore_te_tp1_pp1_s5000
        training_script: pretrain_gpt.py
        n_repeat: 1
        golden_environment: dev
        golden_platform: s5000
        enable_lightweight_mode: false
        gpus_per_node: 8
      - model: gpt
        test_case: qwen3_0p6b_mcore_te_tp2_pp2_benchmark_musa
        training_script: pretrain_gpt.py
        n_repeat: 1
        golden_environment: dev
        golden_platform: s5000
        enable_lightweight_mode: false
        gpus_per_node: 8
