# Generated from .flagcicd/project.yaml; do not edit manually.
# Regenerate: python .github/scripts/ci/validate_flagcicd_contract.py --write-catalog
schema_version: 1
global:
  default_timeout_minutes: 60
  documentation_paths:
  - docs/
  documentation_suffixes:
  - .md
  - .rst
  shared_paths:
  - .flagcicd/
  - .github/
  - docker/
  - uv.lock
  - pyproject.toml
  - setup.py
  - setup.cfg
  - MANIFEST.in
  - codecov.yml
  - tests/test_utils/
  - tests/functional_tests/
  impact_paths:
  - megatron/core/*.py
coverage:
  sources:
  - megatron/plugin/
  - megatron/core/
levels:
  L0:
    purpose: preflight, checkout, configuration, image and dependency checks
    required_groups:
    - core
  L1:
    purpose: single-device unit and numerical smoke tests
    required_groups:
    - core
  L2:
    purpose: distributed, tensor, pipeline and checkpoint tests
    required_groups:
    - core
    - models
  L3:
    purpose: benchmark, performance and coverage regression
    required_groups:
    - core
    - models
    status: planned
  L4:
    purpose: release, backward compatibility and cross-repository acceptance
    required_groups:
    - core
    - models
    status: planned
