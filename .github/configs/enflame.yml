# Enflame Hardware Configuration for Megatron-LM-FL
# This file defines CI/CD settings for Enflame GCU-based testing.
# Validated on: Enflame L600, 8 CI-visible devices,
# torch 2.10.0+cpu, torch_gcu 2.10.0+3.7.20260408

hardware_name: enflame
display_name: 'Enflame Tests'
setup_script: .github/scripts/set_env_enflame.sh

# CI image for the Enflame environment (built and pushed 2026-08-10, validated on Enflame L600)
ci_image: harbor.baai.ac.cn/flagos-dev/megatron-lm-fl:manual-20260810-enflame-dev

# Runner labels for the Enflame node
runner_labels:
  - sy-8g-cicd-megatron

# Container volumes (hardware-specific paths)
container_volumes:
  - /home/gitlab-runner/data:/home/gitlab-runner/data
  - /home/gitlab-runner/tokenizers:/home/gitlab-runner/tokenizers

# Container options (hardware-specific settings)
container_options: >-
  --privileged
  --shm-size=500g
  --hostname megatron_cicd
  --user root
  --ipc=host
  --pid=host
  --ulimit nofile=65535:65535

# Device types to run tests on
device_types:
  - s60

# Test matrix configuration
test_matrix:
  unit:
    nproc_per_node: 8
    # Keep executing collected tests after an import/collection error so one
    # manual run reports the complete platform gap. Collection errors still
    # make the job fail.
    device_types:
      - s60
    pytest_extra_args:
      - --continue-on-collection-errors
      - --tb=short
    groups:
      - name: core
        path: tests/unit_tests/test_*.py megatron/plugin/tests/
        description: Core unit tests
      - name: models
        path: tests/unit_tests/models/
        description: Model tests
      - name: distributed
        path: tests/unit_tests/distributed/
        description: Distributed tests
      - name: dist_checkpointing
        path: tests/unit_tests/dist_checkpointing/
        description: Distributed checkpointing tests
      - name: tensor_parallel
        path: tests/unit_tests/tensor_parallel/
        description: Tensor parallel tests
      - name: pipeline_parallel
        path: tests/unit_tests/pipeline_parallel/
        description: Pipeline parallel tests
      - name: data
        path: tests/unit_tests/data/
        description: Data tests
      - name: fusions
        path: tests/unit_tests/fusions/
        description: Fusion tests
      - name: others
        path: tests/unit_tests/export/ tests/unit_tests/post_training/ tests/unit_tests/tokenizers/ tests/unit_tests/utils/
        description: Export, post-training, tokenizer, and utility tests
    ignored_tests:
      # core
      # Enflame GCU: empty_cache() unstable under 8-proc concurrency, ECCL deadlock in cleanup
      - tests/unit_tests/test_checkpointing.py
      
      
      # models
      # TE-FL vendor.enflame layernorm_fwd: 'NoneType' object has no attribute 'DType'
      - tests/unit_tests/models/test_bert_model.py::TestBertModel::test_constructor
      - tests/unit_tests/models/test_bert_model.py::TestBertModelAttentionDimensions::test_local_spec
      # TE-FL vendor.enflame layernorm_fwd DType error; tensors on different GCU devices
      - tests/unit_tests/models/test_clip_vit_model.py::TestCLIPViTModel::test_save_load
      
      
      # distributed
      # ECCL allgather SIGSEGV in uneven_dtensor._update_offsets_and_cumulative_shape
      - tests/unit_tests/distributed/megatron_fsdp/test_mcore_fully_sharded_data_parallel.py
      - tests/unit_tests/distributed/megatron_fsdp/test_mfsdp_fully_shard.py
     
     
      # dist_checkpointing
      # ECCL all_gather_object deadlock in distributed checkpointing
      - tests/unit_tests/dist_checkpointing/models/test_bert_model.py
      - tests/unit_tests/dist_checkpointing/models/test_gpt_model.py
    
     
     
      # tensor_parallel
      # ECCL allreduce SIGSEGV in cross_entropy
      - tests/unit_tests/tensor_parallel/test_cross_entropy.py::test_vocab_parallel_cross_entropy
      
      
      # pipeline_parallel
      # ECCL collective failures in bridge communicator
      - tests/unit_tests/pipeline_parallel/test_bridge_communicator.py
      # ECCL all_gather deadlock in activation offloading
      - tests/unit_tests/pipeline_parallel/test_fine_grained_activation_offloading.py::test_gpt_fine_grained_activation_offloading_correctness_and_memory
      - tests/unit_tests/pipeline_parallel/test_fine_grained_activation_offloading.py::test_fine_grained_activation_offload_with_ep_a2a_overlap_compatibility

      
      # fusions
      # Triton CUDA kernel not available on GCU
      - tests/unit_tests/fusions/test_mla_yarn_rope_apply.py
      # TE-FL vendor.enflame missing rmsnorm_bwd_add operator
      - tests/unit_tests/fusions/test_rmsnorm_residual_fusion.py


      # others
      # ModelOpt not installed on Enflame
      - tests/unit_tests/post_training/test_modelopt_model_builder.py::test_model_provider_switches_to_modelopt_builder
      # ECCL deadlock in distributed checkpointing via ModelOpt
      - tests/unit_tests/post_training/test_modelopt_module_spec.py
      # FP8 TensorRT-LLM export requires CUDA FP8, not available on GCU
      - tests/unit_tests/export/trtllm/test_distributed_fp8.py
      - tests/unit_tests/export/trtllm/test_single_device_fp8.py
      # CUDA distributed GPU converter
      - tests/unit_tests/export/trtllm/test_trtllm_distributed_gpu_converter.py
      # others
      - tests/unit_tests/post_training/test_modelopt_module_spec.py


  functional:
    train: []
