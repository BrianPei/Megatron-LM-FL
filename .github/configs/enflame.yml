# Enflame Hardware Configuration for Megatron-LM-FL
# This file defines CI/CD settings for Enflame GCU-based testing.
# Validated on: Enflame L600, 8 CI-visible devices,
# torch 2.10.0+cpu, torch_gcu 2.10.0+3.7.20260408

hardware_name: enflame
display_name: 'Enflame Tests'
setup_script: .github/scripts/set_env_enflame.sh

# CI image for the Enflame environment (built and pushed 2026-08-10, validated on Enflame L600)
ci_image: harbor.baai.ac.cn/flagos-dev/megatron-lm-fl:manual-20260810-enflame-dev

# Runner labels for the Enflame node
runner_labels:
  - sy-8g-cicd-megatron

# Container volumes (hardware-specific paths)
container_volumes:
  - /home/gitlab-runner/data:/home/gitlab-runner/data
  - /home/gitlab-runner/tokenizers:/home/gitlab-runner/tokenizers

# Container options (hardware-specific settings)
container_options: >-
  --privileged
  --shm-size=500g
  --hostname megatron_cicd
  --user root
  --ipc=host
  --pid=host
  --ulimit nofile=65535:65535

# Device types to run tests on
device_types:
  - s60

# Test matrix configuration
test_matrix:
  unit:
    nproc_per_node: 8
    # Keep executing collected tests after an import/collection error so one
    # manual run reports the complete platform gap. Collection errors still
    # make the job fail.
    device_types:
      - s60
    pytest_extra_args:
      - --continue-on-collection-errors
      - --tb=short
    groups:
       # - name: core
      #  path: tests/unit_tests/test_*.py megatron/plugin/tests/
      #  description: Core unit tests
       - name: models
         path: tests/unit_tests/models/
         description: Model tests
      #- name: distributed
      #  path: tests/unit_tests/distributed/
      #  description: Distributed tests
      #- name: dist_checkpointing
      #  path: tests/unit_tests/dist_checkpointing/
      #  description: Distributed checkpointing tests
      #- name: tensor_parallel
      #  path: tests/unit_tests/tensor_parallel/
      #  description: Tensor parallel tests
      #- name: pipeline_parallel
      #  path: tests/unit_tests/pipeline_parallel/
      #  description: Pipeline parallel tests
      #- name: data
      #  path: tests/unit_tests/data/
      #  description: Data tests
      #- name: fusions
      #  path: tests/unit_tests/fusions/
      #  description: Fusion tests
      #- name: others
      #  path: tests/unit_tests/export/ tests/unit_tests/post_training/ tests/unit_tests/tokenizers/ tests/unit_tests/utils/
      #  description: Export, post-training, tokenizer, and utility tests
    ignored_tests:
      # core
      # Enflame GCU: empty_cache() unstable under 8-proc concurrency, ECCL deadlock in cleanup
      - tests/unit_tests/test_checkpointing.py
      # torch_gcu has no torch._C._nccl_version; collection error stops entire run
      - tests/unit_tests/test_nccl_allocator.py
      # ECCL process group / allreduce failures in distributed integration; 7/7 tests fail
      - tests/unit_tests/test_hyper_comm_grid.py::TestHyperCommGridIntegration
      # ECCL failures in distributed optimizer (same pattern as metax)
      - tests/unit_tests/test_optimizer.py::test_chained_optimizer
      - tests/unit_tests/test_optimizer.py::test_chained_optimizer_get_parameters
      - tests/unit_tests/test_optimizer.py::test_precision_aware_fused_adam
      - tests/unit_tests/test_optimizer.py::test_precision_aware_optimizer
      - tests/unit_tests/test_optimizer.py::test_distrib_optimizer_save_load_with_non_tensor_state
      - tests/unit_tests/test_optimizer.py::test_optim_sharded_state_dict
      - tests/unit_tests/test_optimizer.py::test_optimizer_reload_model_params
      - tests/unit_tests/test_optimizer.py::test_get_megatron_optimizer_with_custom_process_groups
      - tests/unit_tests/test_optimizer.py::test_get_megatron_optimizer_custom_process_groups_validation
      - tests/unit_tests/test_optimizer.py::test_get_param_groups_no_overrides
      - tests/unit_tests/test_optimizer.py::test_get_param_groups_overlapping_matches
      - tests/unit_tests/test_optimizer.py::test_get_param_groups_appling_wd_to_qk_layernorm
      # ECCL instability in rampup batch size tests; mixed PASS/FAIL across ranks
      - tests/unit_tests/test_num_microbatches_calculator.py::TestRampupBatchsizeNumMicroBatchesCalculator::test_constructor
      - tests/unit_tests/test_num_microbatches_calculator.py::test_ramp_up
      # TE-FL vendor.enflame missing multi_tensor_sgd op (same pattern as ascend)
      - tests/unit_tests/test_optimizer_cpu_offloading.py::test_multi_device_hybrid_optimizer
      - tests/unit_tests/test_optimizer_cpu_offloading.py::test_overlap_cpu_optimizer_d2h_h2d_sync_correctness
      # torch.cuda.device_count() returns 2 instead of 8 (torch_gcu lambda bug); same as musa
      - tests/unit_tests/test_utils.py::test_check_param_hashes_across_dp_replicas
      - tests/unit_tests/test_utils.py::test_cross_check_param_hashes_across_dp_replicas
      - tests/unit_tests/test_utils.py::test_param_norm_linear
      - tests/unit_tests/test_utils.py::test_param_norm_moe
      - tests/unit_tests/test_utils.py::test_straggler_detector
      # ECCL communicator setup failure + distributed directory creation; same as musa
      - tests/unit_tests/test_training.py::TestTraining::test_build_train_valid_test_data_iterators
      - tests/unit_tests/test_training.py::TestSaveGrads::test_save_grads
      # Platform contract tests: Enflame plugin does not implement clock_rate/power_draw/
      # temperature/utilization (return None — no sensor API on GCU), get_compile_backend
      # (no custom compiler backend registered), and is_triton_supported (Triton not
      # available). Ascend/Metax/MUSA implement these via their platform plugins.
      - megatron/plugin/tests/test_platform.py::TestAllRegisteredPlatformsContract::test_clock_rate_returns_numeric
      - megatron/plugin/tests/test_platform.py::TestAllRegisteredPlatformsContract::test_power_draw_returns_numeric
      - megatron/plugin/tests/test_platform.py::TestAllRegisteredPlatformsContract::test_temperature_returns_numeric
      - megatron/plugin/tests/test_platform.py::TestAllRegisteredPlatformsContract::test_utilization_returns_numeric
      - megatron/plugin/tests/test_platform.py::TestAllRegisteredPlatformsContract::test_get_compile_backend_returns_string
      - megatron/plugin/tests/test_platform.py::TestAllRegisteredPlatformsContract::test_is_triton_supported_returns_bool
      
      
      # models
      # TE-FL vendor.enflame layernorm_fwd: 'NoneType' object has no attribute 'DType'
      - tests/unit_tests/models/test_bert_model.py::TestBertModel::test_constructor
      - tests/unit_tests/models/test_bert_model.py::TestBertModelAttentionDimensions::test_local_spec
      # TE-FL generic_gemm flaky on Enflame; mocks TE 1.10 which is not the installed version
      - tests/unit_tests/models/test_bert_model.py::TestBertModelAttentionDimensions::test_transformer_engine_version_1_10
      # TE-FL vendor.enflame layernorm_fwd DType error; tensors on different GCU devices
      - tests/unit_tests/models/test_clip_vit_model.py::TestCLIPViTModel::test_save_load
      # Same TE-FL layernorm_fwd DType error as test_save_load; same as musa
      - tests/unit_tests/models/test_clip_vit_model.py::TestCLIPViTModel::test_forward
      # ECCL deadlock: rank 2 runtime launch counter mismatch; same as ascend/metax
      - tests/unit_tests/models/test_heterogeneous_gpt_model.py
      # flash_attn not available on GCU; collection error during import
      - tests/unit_tests/models/test_gpt_model.py
      # Consistently FAILED (8/8) due to TE-FL layernorm; now ECCL intermittent deadlock (3/8 ranks stuck)
      - tests/unit_tests/models/test_base_embedding.py::TestBaseEmbedding::test_gpu_forward
      # ECCL intermittent deadlock across multiple tests in this file; same approach as metax (metax.yml L233)
      - tests/unit_tests/models/test_llava_model.py
      # All three platforms (ascend/metax/musa) ignore; ECCL deadlock risk
      - tests/unit_tests/models/test_mamba_model.py
      - tests/unit_tests/models/test_mamba_moe_model.py
      - tests/unit_tests/models/test_mimo_1f1b_schedule.py
      - tests/unit_tests/models/test_mimo_checkpoint.py
      # TE-FL vendor.enflame layernorm_fwd DType error + tensors on different GCU devices; same as musa
      - tests/unit_tests/models/test_mimo_submodules.py
      - tests/unit_tests/models/test_multimodal_projector.py::TestMultimodalProjector::test_forward


      # distributed
      # ECCL allgather SIGSEGV in uneven_dtensor._update_offsets_and_cumulative_shape
      - tests/unit_tests/distributed/megatron_fsdp/test_mcore_fully_sharded_data_parallel.py
      - tests/unit_tests/distributed/megatron_fsdp/test_mfsdp_fully_shard.py
      # ECCL SIGSEGV in word embedding gradient allreduce
      - tests/unit_tests/distributed/test_finalize_model_grads.py
      # ECCL allreduce deadlock: rank 2 runtime launch counter mismatch; same as ascend/metax
      - tests/unit_tests/distributed/test_grad_reduce_for_replicated_embedder.py
      - tests/unit_tests/distributed/test_grad_sync_with_expert_parallel.py
      - tests/unit_tests/distributed/test_param_and_grad_buffer.py
      - tests/unit_tests/distributed/test_reduce_scatter_with_fp32_accumulation.py
      - tests/unit_tests/distributed/test_torch_fully_sharded_parallel.py


      # dist_checkpointing
      # ECCL all_gather_object deadlock in distributed checkpointing
      - tests/unit_tests/dist_checkpointing/models/test_bert_model.py
      - tests/unit_tests/dist_checkpointing/models/test_gpt_model.py
    
     
     
      # tensor_parallel
      # ECCL allreduce SIGSEGV in cross_entropy
      - tests/unit_tests/tensor_parallel/test_cross_entropy.py::test_vocab_parallel_cross_entropy
      # ECCL broadcast hang: rank 2 launch counter mismatch, all ranks stuck in init_process_group
      - tests/unit_tests/tensor_parallel/test_data.py::test_broadcast_data
      
      
      # pipeline_parallel
      # ECCL collective failures in bridge communicator
      - tests/unit_tests/pipeline_parallel/test_bridge_communicator.py
      # ECCL all_gather deadlock in activation offloading
      - tests/unit_tests/pipeline_parallel/test_fine_grained_activation_offloading.py::test_gpt_fine_grained_activation_offloading_correctness_and_memory
      - tests/unit_tests/pipeline_parallel/test_fine_grained_activation_offloading.py::test_fine_grained_activation_offload_with_ep_a2a_overlap_compatibility
      # ECCL p2p send/recv hang + collective failures in multimodule communicator; 7/7 tests fail or deadlock
      - tests/unit_tests/pipeline_parallel/test_multimodule_communicator.py


      # data
      # HuggingFace tokenizer downloads fail in CI (no network access); same reason as ascend/metax/musa
      - tests/unit_tests/data/test_bin_reader.py
      - tests/unit_tests/data/test_preprocess_data.py
      - tests/unit_tests/data/test_preprocess_mmdata.py
      - tests/unit_tests/data/test_fim_dataset.py


      # fusions
      # Triton CUDA kernel not available on GCU
      - tests/unit_tests/fusions/test_mla_yarn_rope_apply.py
      # TE-FL vendor.enflame missing rmsnorm_bwd_add operator
      - tests/unit_tests/fusions/test_rmsnorm_residual_fusion.py


      # others
      # ModelOpt not installed on Enflame
      - tests/unit_tests/post_training/test_modelopt_model_builder.py::test_model_provider_switches_to_modelopt_builder
      # ECCL deadlock in distributed checkpointing via ModelOpt
      - tests/unit_tests/post_training/test_modelopt_module_spec.py
      # FP8 TensorRT-LLM export requires CUDA FP8, not available on GCU
      - tests/unit_tests/export/trtllm/test_distributed_fp8.py
      - tests/unit_tests/export/trtllm/test_single_device_fp8.py
      # CUDA distributed GPU converter
      - tests/unit_tests/export/trtllm/test_trtllm_distributed_gpu_converter.py
      # HuggingFace tokenizer downloads fail in CI (no network access); same reason as ascend/metax/musa
      - tests/unit_tests/tokenizers/test_tokenizer.py


  functional:
    train: []
