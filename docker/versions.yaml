# TE-FL Version Lock and Platform Configuration
# This file is the single source of truth for TE-FL versions and platform images.
# DO NOT manually edit TE-FL commit or artifact URLs without running the update script.

# TE-FL repository and base commit
te_fl:
  repository: "https://github.com/FlagOpen/TransformerEngine-FL.git"
  # REQUIRED: Fixed commit SHA (40 hex chars). Must be updated via update_te_lock.py.
  # Leave empty on first integration; build_images.yml will fail with explicit error.
  commit: ""

  # Branch to monitor for automatic updates (optional)
  watch_branch: "main"

  # Update policy: "manual" or "auto"
  # - manual: only update via update_te_lock.py or manual PR
  # - auto: monitor watch_branch and create PR when new commit detected
  update_policy: "manual"

# Platform-specific configuration
# Each platform MUST specify:
#   - base_image: base runtime image (with digest preferred)
#   - torch_version: PyTorch version string
#   - python_version: Python version (e.g., "3.10", "3.12")
#   - vendor_sdk:厂商 SDK 版本标识
#   - te_fl_artifact: TE-FL wheel URL or image@digest (empty initially)
platforms:
  cuda:
    # NVIDIA CUDA platform
    base_image: ""  # REQUIRED: fill with actual base image
    torch_version: ""
    python_version: "3.10"
    vendor_sdk: "cuda-12.1"
    cuda_arch: "80;90"  # A100, H100
    compiler: "gcc-11"
    te_fl_artifact: ""
    runner_labels:
      - "ubuntu-latest"

  musa:
    # Moore Threads MUSA
    base_image: "registry.mthreads.com/mcconline/musa-runtime:4.3.5"
    torch_version: "2.1.0"
    python_version: "3.10"
    vendor_sdk: "musa-4.3.5"
    cuda_arch: ""  # MUSA specific
    compiler: "gcc-11"
    te_fl_artifact: ""
    runner_labels:
      - "self-hosted"
      - "mt-8g-cicd-megatron"

  metax:
    # MetaX MACA
    base_image: ""  # REQUIRED: fill with validated base
    torch_version: "2.3.0"
    python_version: "3.12"
    vendor_sdk: "maca-3.7.0"
    cuda_arch: ""
    compiler: "gcc-11"
    te_fl_artifact: ""
    runner_labels:
      - "self-hosted"
      - "mx-8g-cicd-megatron"

  ascend:
    # Huawei Ascend NPU
    base_image: ""  # REQUIRED: fill with CANN runtime base
    torch_version: "2.7.1"
    python_version: "3.10"
    vendor_sdk: "cann-9.0.0"
    cuda_arch: ""
    compiler: "gcc-11"
    te_fl_artifact: ""
    runner_labels:
      - "self-hosted"
      - "flagcicd-910c"

  hygon:
    # Hygon DCU
    base_image: ""  # REQUIRED: fill with DTK base
    torch_version: ""
    python_version: "3.10"
    vendor_sdk: "dtk-26.04"
    cuda_arch: ""
    compiler: "gcc-11"
    te_fl_artifact: ""
    runner_labels:
      - "self-hosted"
      - "hy-8g-cicd-megatron"

  kunlunxin:
    # Kunlunxin XPU
    base_image: ""  # REQUIRED: fill with XRE base
    torch_version: ""
    python_version: "3.10"
    vendor_sdk: "xre-latest"
    cuda_arch: ""
    compiler: "gcc-11"
    te_fl_artifact: ""
    runner_labels:
      - "self-hosted"
      - "kl-8g-cicd-megatron"

  enflame:
    # Enflame GCU
    base_image: ""  # REQUIRED: fill with torch_gcu base
    torch_version: "2.1.1"
    python_version: "3.12"
    vendor_sdk: "gcu-1.9.29"
    cuda_arch: ""
    compiler: "gcc-11"
    te_fl_artifact: ""
    runner_labels:
      - "self-hosted"
      - "sy-8g-cicd-megatron"

# Validation rules (enforced by build.sh and CI)
validation:
  te_fl_commit_format: "^[0-9a-f]{40}$"
  require_digest_in_artifact: true
  require_base_image_digest: false  # Warn only initially
  require_all_platforms: false  # Allow incremental rollout
