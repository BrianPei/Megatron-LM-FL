schema_version: flagcicd.project/v2
repository: Megatron-LM-FL
entry_workflow: .github/workflows/flagcicd-entry.yml
levels:
  L0:
    goal: configuration-and-execution-plan
    hardware: false
    checks: [lint, ci-helper-tests, manifest, routing, paths, resource-contracts]
  L1:
    goal: component-correctness
    hardware: true
    kinds: [unit]
  L2:
    goal: representative-training
    hardware: true
    kinds: [functional]
  L3:
    goal: combination-compatibility-stress-and-performance-regression
    hardware: true
    kinds: [unit, functional]
    onboarding: Register validated combinations and calibrated performance criteria per platform
  L4:
    goal: model-scale-and-release-acceptance
    hardware: true
    kinds: [unit, functional]
    onboarding: Register long training, scale and release-candidate validation per platform
selection:
  default: registered-supported-baseline
  diff_label: ci:diff
  platform_labels: additive
  merge_scope_reduction: disabled
  functional_mode: supplemental
schedules:
  nightly:
    cron: '0 18 * * *'
    target_level: L3
  weekly:
    cron: '0 18 * * 6'
    target_level: L4
coverage:
  source_roots: [megatron/training, megatron/plugin]
  aggregation: per-platform-and-device
report_schema: flagcicd.report/v2
# Frozen identities of the migration baseline, not copies of test definitions.
# New classified entries do not silently expand or shrink default PR verification.
migration_baseline:
  ascend:
    - unit:core
    - unit:models
    - unit:distributed
    - unit:dist_checkpointing
    - unit:tensor_parallel
    - unit:pipeline_parallel
    - unit:data
    - unit:fusions
